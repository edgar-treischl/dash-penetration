name: Docs & Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    name: "Build Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e '.[dev]'

      - name: Build documentation
        run: |
          mkdir -p docs
          echo "# Web Crawler Documentation" > docs/index.md
          echo "" >> docs/index.md
          echo "## Getting Started" >> docs/index.md
          echo "" >> docs/index.md
          echo "See [README.md](../README.md) and [plan.md](../plan.md) for development guide." >> docs/index.md
          echo "" >> docs/index.md
          echo "## Architecture" >> docs/index.md
          echo "" >> docs/index.md
          echo "See [.github/copilot-instructions.md](.github/copilot-instructions.md) for architecture overview." >> docs/index.md

      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/
          retention-days: 30

  publish-docs:
    name: "Publish to GitHub Pages"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
