name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "Build Docs"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e '.[dev]'

      - name: Build documentation
        run: |
          mkdir -p docs
          echo "# Web Crawler Documentation" > docs/index.md
          echo "" >> docs/index.md
          echo "## Getting Started" >> docs/index.md
          echo "" >> docs/index.md
          echo "See [README.md](../README.md) and [plan.md](../plan.md) for development guide." >> docs/index.md
          echo "" >> docs/index.md
          echo "## Architecture" >> docs/index.md
          echo "" >> docs/index.md
          echo "See [.github/copilot-instructions.md](.github/copilot-instructions.md) for architecture overview." >> docs/index.md

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    name: "Deploy Docs"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
