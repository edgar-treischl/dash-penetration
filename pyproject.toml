[project]
name = "dash-penetration"
version = "0.1.0"
description = "Web penetration testing learning project - Phase 1: Python crawler"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Edgar Treischl", email = "edgar@treischl.de"}
]
keywords = ["penetration-testing", "web-crawling", "security", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "httpx==0.27.0",
    "selectolax==0.3.21",
    "python-dotenv==1.0.1",
    "click==8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "black==24.8.0",
    "flake8==7.1.1",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
dash-crawler = "dash_penetration.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
